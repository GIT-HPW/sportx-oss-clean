<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SportX 是一个开源的全球足球与篮球赛事规划台，支持赛程筛选、球星关注、日历规划和轻量比赛预测。" />
    <meta name="theme-color" content="#0b63f6" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SportX 全球赛事规划台" />
    <meta property="og:description" content="在一个响应式仪表盘中追踪全球足球、篮球赛事与关注球星。" />
    <meta property="og:url" content="https://git-hpw.github.io/sportx-oss-clean/" />
    <meta property="og:image" content="https://git-hpw.github.io/sportx-oss-clean/assets/sportx-focus-board.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>SportX 赛事规划台</title>
    <script>
      document.documentElement.dataset.theme = localStorage.getItem("sportx-theme") || "light";
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="#" aria-label="SportX 首页">
          <span class="brand-mark">SX</span>
          <span class="brand-name">SportX</span>
        </a>
        <nav class="nav-list">
          <a class="nav-item active" href="#overview">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6v-9h-6v9Zm0-16v5h6V4h-6Z" /></svg>
            </span>
            总览
          </a>
          <a class="nav-item" href="#calendar">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M7 2h2v3H7V2Zm8 0h2v3h-2V2ZM4 5h16a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm0 6v9h16v-9H4Z" /></svg>
            </span>
            日历
          </a>
          <a class="nav-item" href="#players">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z" /></svg>
            </span>
            球星
          </a>
          <a class="nav-item" href="#following">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="m12 17.27 5.18 3.05-1.37-5.83 4.52-3.93-5.96-.51L12 4.55 9.63 10.05l-5.96.51 4.52 3.93-1.37 5.83L12 17.27Z" /></svg>
            </span>
            关注
          </a>
        </nav>
        <div class="sidebar-footer">
          <div class="timezone-pill">UTC+8</div>
          <button class="icon-button" id="exportButton" type="button" aria-label="导出日历">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14v-2H5v2ZM13 4h-2v8.17L7.41 8.59 6 10l6 6 6-6-1.41-1.41L13 12.17V4Z" /></svg>
          </button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">全球足球与篮球赛事</p>
            <h1>赛事规划台</h1>
          </div>
          <div class="topbar-actions">
            <label class="search-field">
              <span aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M9.5 3a6.5 6.5 0 0 1 5.17 10.44l5.45 5.44-1.41 1.41-5.44-5.45A6.5 6.5 0 1 1 9.5 3Zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Z" /></svg>
              </span>
              <input id="searchInput" type="search" placeholder="搜索赛事、球队、球星" />
            </label>
            <label class="theme-field" aria-label="页面风格">
              <span aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18h1.5a2.5 2.5 0 0 0 0-5H12a1.5 1.5 0 0 1 0-3h3a6 6 0 0 0 0-12H12Zm-4 7.5A1.5 1.5 0 1 1 8 7a1.5 1.5 0 0 1 0 3.5Zm3.5-3A1.5 1.5 0 1 1 10 6a1.5 1.5 0 0 1 1.5 1.5Zm-5 7A1.5 1.5 0 1 1 5 13a1.5 1.5 0 0 1 1.5 1.5Z" /></svg>
              </span>
              <select id="themeSelect">
                <option value="light">白色</option>
                <option value="dark">黑色</option>
                <option value="deepblue">深蓝</option>
                <option value="scifi">科幻</option>
              </select>
            </label>
            <button class="icon-button has-dot" type="button" aria-label="提醒中心">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6v-5a7 7 0 0 0-5-6.71V3a2 2 0 0 0-4 0v1.29A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z" /></svg>
            </button>
          </div>
        </header>

        <section class="hero-band" id="overview">
          <div class="hero-copy">
            <p class="section-label">Next 30 days</p>
            <h2>关键赛程</h2>
            <p>从世界杯、欧洲杯、美洲杯、亚洲杯，到俱乐部赛事、青年队和球星相关比赛，统一按本地时间整理。</p>
            <p class="data-note" id="dataNote">正在连接真实赛程数据...</p>
            <div class="quick-actions">
              <button class="primary-button" id="focusImportant" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 9.55 8.83H2l6.1 4.44L5.76 20 12 15.85 18.24 20l-2.34-6.73L22 8.83h-7.55L12 2Z" /></svg>
                重点比赛
              </button>
              <button class="secondary-button" id="focusPlayers" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z" /></svg>
                球星赛程
              </button>
              <button class="secondary-button" id="refreshData" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.45 5.1h-2.13A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h8V3l-3.35 3.35Z" /></svg>
                刷新
              </button>
            </div>
          </div>
          <div class="hero-visual" aria-label="SportX 赛事焦点图">
            <img src="assets/sportx-focus-board.svg" alt="足球场和篮球场上的赛程焦点图" />
          </div>
        </section>

        <section class="metrics" aria-label="赛事概览">
          <article class="metric-tile">
            <span>今日比赛</span>
            <strong id="todayCount">0</strong>
            <small>含关注球队</small>
          </article>
          <article class="metric-tile">
            <span>本周重点</span>
            <strong id="importantCount">0</strong>
            <small>淘汰赛与德比</small>
          </article>
          <article class="metric-tile">
            <span>球星相关</span>
            <strong id="playerCount">0</strong>
            <small>未来 30 天</small>
          </article>
          <article class="metric-tile">
            <span>青年赛事</span>
            <strong id="youthCount">0</strong>
            <small>U17-U21</small>
          </article>
        </section>

        <section class="workspace">
          <div class="primary-column">
            <section class="toolbar" aria-label="赛程筛选">
              <div class="segmented" role="group" aria-label="运动筛选">
                <button class="segment active" data-filter-group="sport" data-filter-value="all" type="button">全部</button>
                <button class="segment" data-filter-group="sport" data-filter-value="football" type="button">足球</button>
                <button class="segment" data-filter-group="sport" data-filter-value="basketball" type="button">篮球</button>
              </div>
              <div class="segmented" role="group" aria-label="赛事类型筛选">
                <button class="segment active" data-filter-group="type" data-filter-value="all" type="button">全类型</button>
                <button class="segment" data-filter-group="type" data-filter-value="club" type="button">俱乐部</button>
                <button class="segment" data-filter-group="type" data-filter-value="national" type="button">国家队</button>
                <button class="segment" data-filter-group="type" data-filter-value="youth" type="button">青训</button>
              </div>
              <select id="regionSelect" aria-label="地区筛选">
                <option value="all">全部地区</option>
                <option value="Europe">欧洲</option>
                <option value="Asia">亚洲</option>
                <option value="Americas">美洲</option>
                <option value="Global">全球</option>
              </select>
            </section>

            <section class="panel" id="calendar">
              <div class="panel-header">
                <div>
                  <p class="section-label">Calendar</p>
                  <h2>七日赛程</h2>
                </div>
                <div class="view-switch" role="group" aria-label="视图切换">
                  <button class="icon-button active" data-view="calendar" type="button" aria-label="日历视图">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h2v3H7V2Zm8 0h2v3h-2V2ZM4 5h16a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm0 6v9h16v-9H4Z" /></svg>
                  </button>
                  <button class="icon-button" data-view="list" type="button" aria-label="列表视图">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v2H4V5Zm0 6h16v2H4v-2Zm0 6h16v2H4v-2Z" /></svg>
                  </button>
                </div>
              </div>
              <div class="calendar-grid" id="calendarGrid" aria-live="polite"></div>
            </section>

            <section class="panel">
              <div class="panel-header">
                <div>
                  <p class="section-label">Matches</p>
                  <h2>重点列表</h2>
                </div>
                <button class="ghost-button" id="clearFilters" type="button">重置筛选</button>
              </div>
              <div class="match-list" id="matchList" aria-live="polite"></div>
            </section>
          </div>

          <aside class="insight-column">
            <section class="panel compact" id="players">
              <div class="panel-header">
                <div>
                  <p class="section-label">Players</p>
                  <h2>球星追踪</h2>
                </div>
              </div>
              <div class="player-list" id="playerList"></div>
            </section>

            <section class="panel compact" id="following">
              <div class="panel-header">
                <div>
                  <p class="section-label">Following</p>
                  <h2>我的关注</h2>
                </div>
              </div>
              <div class="follow-grid">
                <button class="follow-chip selected" data-follow="Real Madrid" type="button">Real Madrid</button>
                <button class="follow-chip selected" data-follow="Argentina" type="button">Argentina</button>
                <button class="follow-chip" data-follow="NBA Finals" type="button">NBA Finals</button>
                <button class="follow-chip selected" data-follow="U20 World Cup" type="button">U20 World Cup</button>
              </div>
            </section>

            <section class="panel compact">
              <div class="panel-header">
                <div>
                  <p class="section-label">Conflicts</p>
                  <h2>时间冲突</h2>
                </div>
              </div>
              <div class="conflict-list" id="conflictList"></div>
            </section>
          </aside>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
